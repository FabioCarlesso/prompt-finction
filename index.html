<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gere prompts reutilizáveis a partir de modelos para suas tarefas de desenvolvimento." />
  <title>Prompt Fiction</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>Prompt Fiction</h1>
    <p>Gere prompts reutilizáveis a partir de modelos para suas tarefas.</p>
  </header>

  <main>

    <section class="card">
      <h2>Modelo</h2>
      <div class="field">
        <label for="template-select">Selecione o modelo de prompt</label>
        <select id="template-select">
        </select>
      </div>
    </section>

    <section class="card">
      <h2>Campos obrigatórios</h2>
      <div class="field">
        <label for="task">Descrição da tarefa / issue / PR</label>
        <textarea id="task" placeholder="Descreva a tarefa, o que deve ser feito, o contexto..." rows="3"></textarea>
        <span id="task-error" class="field-error">Por favor, informe a descrição da tarefa.</span>
      </div>
    </section>

    <section class="card">
      <h2>Campos opcionais</h2>
      <div class="field">
        <label for="branch">Nome da branch <span class="optional">(opcional)</span></label>
        <input type="text" id="branch" placeholder="ex: feature/minha-feature" />
      </div>
      <div class="field">
        <label for="link">Link da issue ou PR <span class="optional">(opcional)</span></label>
        <input type="url" id="link" placeholder="https://github.com/..." />
      </div>
      <div class="field">
        <label for="tech">Tecnologia principal <span class="optional">(opcional)</span></label>
        <input type="text" id="tech" placeholder="ex: Java, React, Python..." />
      </div>
      <div class="field">
        <label for="notes">Observações adicionais <span class="optional">(opcional)</span></label>
        <textarea id="notes" placeholder="Restrições, contexto extra, requisitos específicos..." rows="2"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>Resultado</h2>
      <div class="actions">
        <button id="generate-btn" type="button">Gerar Prompt</button>
        <button id="copy-btn" type="button" disabled>Copiar</button>
      </div>
      <div class="field" style="margin-top: 1rem;">
        <textarea id="result" readonly placeholder="O prompt gerado aparecerá aqui..."></textarea>
      </div>
      <div id="copy-message" class="copy-message"></div>
    </section>

  </main>

  <footer>
    <p>
      <a href="https://github.com/FabioCarlesso/prompt-finction" target="_blank" rel="noopener">
        Prompt Fiction no GitHub
      </a>
    </p>
  </footer>

  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
